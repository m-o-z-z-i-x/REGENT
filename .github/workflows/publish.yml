name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the suite
        run: uv run --extra dev python -m pytest -q

  build:
    name: Build the distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the wheel and the sdist
        run: uv build

      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          packaged=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' regent/metadata.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "packaged $packaged, tag $tag"
          test "$packaged" = "$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/regent-mcp

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1